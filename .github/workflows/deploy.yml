name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script_stop: true
          script: |
            cd ~/online-judge
            git pull origin main

            # 1. Start infrastructure (db, redis, ai-service) — NOT the backend
            sudo docker compose up -d db redis ai-service

            # 2. Build the Go binary using Docker (no Go needed on host)
            sudo docker build -t backend-build -f Dockerfile .

            # 3. Extract the compiled binary from the image onto the host
            cid=$(sudo docker create backend-build)
            sudo docker cp $cid:/app/backend-server ./backend-server
            sudo docker rm $cid
            chmod +x ./backend-server

            # 4. Stop the old Docker-based backend container if it exists
            sudo docker compose stop backend 2>/dev/null || true
            sudo docker compose rm -f backend 2>/dev/null || true

            # 5. Install systemd service and restart the backend natively
            sudo cp online-judge.service /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable online-judge
            sudo systemctl restart online-judge

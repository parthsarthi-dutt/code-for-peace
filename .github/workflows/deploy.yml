name: Deploy to EC2

on:
  push:
    branches:
      - main  # Triggers the workflow when you push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to the project directory
            cd ~/online-judge
            
            # Pull the latest changes from GitHub
            git pull origin main
            
            # Force rebuild backend without cache to fix corrupted layer caching
            sudo docker compose build --no-cache backend
            
            # Completely tear down existing containers to forcefully release mapped ports
            sudo docker compose down
            
            # Nuke any lingering native zombie processes hogging port 8080 with SIGKILL
            sudo fuser -k -9 8080/tcp || true
            
            # Restart the necessary Docker containers (including db and redis since we brought them down)
            sudo docker compose up -d backend ai-service db redis

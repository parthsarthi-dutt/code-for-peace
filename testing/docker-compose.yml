

services:
  # ── InfluxDB — k6 time-series storage ─────────
  influxdb:
    image: influxdb:1.8
    container_name: oj-influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_HTTP_MAX_BODY_SIZE=0
    volumes:
      - influxdb-data:/var/lib/influxdb

  # ── Prometheus — scrapes Redis & system metrics ─
  prometheus:
    image: prom/prometheus:latest
    container_name: oj-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    depends_on:
      - redis-exporter

  # ── Redis Exporter — exposes Redis metrics ─────
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: oj-redis-exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=host.docker.internal:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Grafana — dashboards ──────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: oj-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - influxdb
      - prometheus

volumes:
  influxdb-data:
  grafana-data:
  prometheus-data:
